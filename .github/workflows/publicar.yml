name: Publicar Clareira (site + app Android)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências
        run: npm ci
      - name: Gerar ícones do app
        run: |
          pip install --quiet pillow fonttools
          python3 scripts/make-icons.py
      - name: Chave de assinatura (fica no cache privado do GitHub)
        uses: actions/cache@v4
        with:
          path: keystore/debug.keystore
          key: clareira-keystore-v1
      - name: Criar a chave na primeira vez
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            mkdir -p keystore
            keytool -genkeypair -keystore keystore/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Clareira,O=Clareira,C=BR"
          fi
      - name: Montar o site
        run: npm run build
      - name: Criar o projeto Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
      - name: Gerar o APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Colocar o APK no site
        run: cp android/app/build/outputs/apk/debug/app-debug.apk dist/Clareira.apk
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
